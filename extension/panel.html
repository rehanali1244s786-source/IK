<!doctype html><meta charset="utf-8">
<style>
 :root{color-scheme:dark}
 *{box-sizing:border-box}
 body{margin:0;font:13px system-ui,"Segoe UI",sans-serif;background:#16181d;color:#eee;border:1px solid #2c303a;border-radius:12px;overflow:hidden}
 header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1d2027;border-bottom:1px solid #2c303a;font-weight:700}
 header b{color:#fb7185}header span{flex:1}
 .x{cursor:pointer;opacity:.7;padding:2px 6px}.x:hover{opacity:1}
 .title{padding:10px 12px 2px;font-weight:600;max-height:3.4em;overflow:hidden;word-break:break-word}
 .hint{padding:0 12px 8px;opacity:.65;font-size:12px}
 .row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid #23262e;cursor:pointer}
 .row:hover{background:#e11d4833}.row small{opacity:.65}
 .msg{padding:16px 12px;opacity:.85;word-break:break-word}
 label{display:block;padding:8px 12px 0;font-size:12px;opacity:.7}
 input{width:100%;padding:7px 8px;border-radius:6px;border:1px solid #343945;background:#0f1115;color:#eee;font:inherit}
 input[readonly]{opacity:.6}
 .line{display:flex;align-items:center;gap:6px;margin:3px 12px 0}
 .ext{opacity:.7}
 .btns{display:flex;gap:8px;padding:14px 12px 12px}
 button{border:0;border-radius:7px;padding:8px 10px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:#3a3f4b}
 .v{background:#e11d48;flex:1}.a{background:#2563eb;flex:1}
 button:disabled{opacity:.4;cursor:not-allowed}
 .info{padding:8px 12px 0;font-size:12px;opacity:.8}
</style>
<div id="app"></div>
<script src="panel.js"></script>
